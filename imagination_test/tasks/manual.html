<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Задачи вне браузера</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="../index.html">← Журнал</a><span>Суммарный вес: 36 б. из 100</span></div>
  <h1>Задачи вне браузера</h1>
  <p class="dim">Эти четыре задачи требуют шахматного и шашечного движка и физического кубика, поэтому выполняются во внешних программах, а сюда заносится только исход попытки. Правило трёх успехов подряд действует и здесь.</p>
  <div id="warn"></div>

  <div id="cards"></div>
</div>

<script src="../assets/core.js"></script>
<script>
IT.ready(function () {
document.getElementById('warn').innerHTML = IT.warnBox();

var INFO = {
  checkers: {
    how: [
      'Русские шашки, доска закрыта либо убрана. Ходы противника объявляются один раз и на экран не выводятся.',
      'Подойдёт любая программа с текстовым вводом ходов: свои ходы вводятся, чужие проговариваются вслух и тут же скрываются.',
      'Обязательное взятие соблюдается: попытка пропустить обязательное взятие — незаконный ход и немедленная неудача попытки.',
      'После партии позиция воспроизводится полностью: где какие шашки и какие из них дамки.'
    ]
  },
  chess: {
    how: [
      'Lichess: раздел «Игра с компьютером», уровень 1, в настройках доски включён режим «вслепую» (доска скрыта, ходы вводятся текстом).',
      'Ступень 1 проверяется иначе: случайная позиция из 8 фигур, осмотр 30 секунд, затем доска закрывается и позиция воспроизводится по полям.',
      'Зевок материала в один ход — это подставка фигуры под бой без компенсации, обнаруженная при разборе партии после её окончания.',
      'После партии — обязательный разбор: он показывает, где образ доски разошёлся с действительностью.'
    ]
  },
  mate: {
    how: [
      'Позиция генерируется случайно: свой король и материал против голого короля, все фигуры на случайных законных полях.',
      'Играется вслепую до мата. Просрочка в 50 ходов, пат и потеря материала — неудача попытки.',
      'Ферзь стоит первой ступенью не по скорости мата, а потому что удержание одной фигуры проще; главная опасность здесь — не заметить пат.',
      'Слон и конь — верхняя ступень: маршрут короля по краю доски требует удерживать поля обоих цветов одновременно.'
    ]
  },
  rubik: {
    how: [
      'Обязательное условие: слежение только зрительным образом. Буквенные пары, схемы спидкубинга и любые словесные мнемотехники запрещены — иначе задача измеряет словесную память, а не картинку.',
      'Заучивание с открытыми глазами, сборка — с закрытыми либо с повязкой, кубик из рук не выпускается. Время не ограничено ни на заучивании, ни на сборке.',
      'Ступени 2 и 3 различаются боковой коркой: на второй довольно того, чтобы грань стала одноцветной, кубики при этом могут стоять не на своих местах; на третьей примыкающие ряды соседних граней тоже обязаны сойтись, то есть собран именно слой.',
      'Ошибка хотя бы в одной наклейке — неудача попытки целиком.'
    ]
  }
};

function card(T) {
  var t = IT.get(T.id), h = '';
  h += '<div class="panel" id="' + T.id + '">';
  h += '<h2 style="margin-top:0">' + T.n + ' <span class="tag">вес ' + T.w + ' б.</span></h2>';
  h += '<p class="dim">' + T.d + '</p>';
  h += '<div class="ladder">';
  for (var i = 0; i < T.r.length; i++) {
    var n = i + 1, cls = n <= t.rung ? 'done' : (n === t.rung + 1 ? 'next' : '');
    var st = t.streak['r' + n] || 0;
    h += '<div class="rung ' + cls + '"><b>' + n + '</b> ' + T.r[i] + (st ? ' <i>серия ' + st + '/3</i>' : '') + '</div>';
  }
  h += '</div>';
  h += '<h3>Как проводится</h3><ul>';
  INFO[T.id].how.forEach(function (s) { h += '<li>' + s + '</li>'; });
  h += '</ul>';
  h += '<p class="hint">Взята ступень ' + t.rung + ' из ' + T.r.length + '. Баллы: ' + IT.points(T, t).toFixed(2) + ' из ' + T.w + '.</p>';
  h += '<div class="row">' + IT.rungSelect(T.id, 'sel_' + T.id) +
       '<button class="primary" data-ok="1" data-id="' + T.id + '">Записать успех</button>' +
       '<button data-ok="0" data-id="' + T.id + '">Записать неудачу</button></div>';
  h += '<div id="out_' + T.id + '"></div></div>';
  return h;
}

var LIST = ['chess', 'checkers', 'mate', 'rubik'].map(function (id) { return IT.task(id); });
document.getElementById('cards').innerHTML = LIST.map(card).join('');

var bs = document.querySelectorAll('button[data-id]');
for (var i = 0; i < bs.length; i++) {
  bs[i].onclick = function () {
    var id = this.getAttribute('data-id'), ok = this.getAttribute('data-ok') === '1';
    var rung = parseInt(document.getElementById('sel_' + id).value, 10);
    document.getElementById('out_' + id).innerHTML = IT.report(id, rung, ok, 1, '');
  };
}
});
</script>
</body>
</html>
