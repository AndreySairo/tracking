; BlueTrail - настройки шлейфа. Файл читается при запуске.
; После правки перезапустите программу (в меню значка - Выход).

; Время жизни хвоста в миллисекундах. 250 - мягкий след,
; 50 - почти незаметный смаз, 600 - длинная лента.
TrailMs=250

; Толщина яркого ядра линии в пикселях у самого курсора.
Thickness=5

; Во сколько раз светящийся ореол шире ядра.
GlowScale=4

; Общая непрозрачность: 1.0 - как задумано, 0.5 - вдвое бледнее.
Opacity=1

; Цвета в формате R,G,B: ядро, середина, внешний ореол.
CoreColor=205,230,255
MidColor=105,175,255
GlowColor=30,110,235

; Служебное: шаг набора точек (px), кадров в секунду,
; на сколько участков делится хвост при отрисовке.
MinDist=2
Fps=120
Bands=14
